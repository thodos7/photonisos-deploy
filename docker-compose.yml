# Photonisos - WordPress + MySQL for the shared VM ai4talos.aegean.gr
#
# Where things live (so the VM stays tidy for other projects):
#   /home/user/photonisos            this repo, WordPress files (./wordpress), MySQL files (./db_data)
#   /mnt/ai4talos/photonisos         photo uploads, UpdraftPlus backups, files being transferred
#
# Only ONE port is published (WEB_PORT). The database has no "ports:" on purpose:
# it can only be reached by the WordPress container.

name: photonisos

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# The official WordPress image reads these at run time, so the WP-CLI container needs them too.
x-wp-env: &wp-env
  WORDPRESS_DB_HOST: db
  WORDPRESS_DB_NAME: ${DB_NAME}
  WORDPRESS_DB_USER: ${DB_USER}
  WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
  WORDPRESS_TABLE_PREFIX: wp_
  WORDPRESS_CONFIG_EXTRA: |
    define('DISALLOW_FILE_EDIT', true);
    define('DISABLE_WP_CRON', ${DISABLE_WP_CRON:-false});

services:
  db:
    image: ${DB_IMAGE:-mysql:8.4}
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    command: --character-set-server=utf8mb4
    volumes:
      - ./db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: 4g
    cpus: 4
    logging: *default-logging

  wordpress:
    image: ${WP_IMAGE:-wordpress:php8.2-apache}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-8088}:80"
    environment: *wp-env
    volumes:
      - ./wordpress:/var/www/html
      - ${DATA_DIR:-/mnt/ai4talos/photonisos}/uploads:/var/www/html/wp-content/uploads
      - ${DATA_DIR:-/mnt/ai4talos/photonisos}/backups:/var/www/html/wp-content/updraft
      - ./php/photonisos.ini:/usr/local/etc/php/conf.d/zz-photonisos.ini:ro
      - ./config/uploads-no-php.conf:/etc/apache2/conf-enabled/uploads-no-php.conf:ro
    mem_limit: 6g
    cpus: 8
    logging: *default-logging

  # Command-line tool, only started on demand:  docker compose run --rm wpcli wp <command>
  wpcli:
    image: ${WPCLI_IMAGE:-wordpress:cli-php8.2}
    profiles: ["tools"]
    user: "33:33"          # same uid as www-data in the Debian-based wordpress image
    working_dir: /var/www/html
    environment:
      <<: *wp-env
      WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
      HOME: /tmp
    volumes:
      - ./wordpress:/var/www/html
      - ${DATA_DIR:-/mnt/ai4talos/photonisos}/uploads:/var/www/html/wp-content/uploads
      - ${DATA_DIR:-/mnt/ai4talos/photonisos}/backups:/var/www/html/wp-content/updraft
    depends_on:
      - db
